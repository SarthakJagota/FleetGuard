name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Unit + integration tests
        run: pytest
      - name: Pipeline smoke test (tiny models, no MLflow)
        run: python -m fleetguard --fast --no-mlflow run-all --subsets FD001
