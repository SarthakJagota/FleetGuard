[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetguard"
version = "1.0.0"
description = "Closed-loop predictive maintenance: RUL prediction, anomaly detection, rule-based triage agent and MLOps on NASA C-MAPSS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sarthak Jagota" }]
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "mlflow>=2.12",
    "streamlit>=1.35",
    "plotly>=5.20",
    "shap>=0.45",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
fleetguard = "fleetguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
